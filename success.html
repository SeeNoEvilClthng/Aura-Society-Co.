<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order Confirmed | Aura Society Co.</title>
    <meta name="description" content="Aura Society Co. order confirmation.">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="styles.css?v=browse-20261027">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8GLJ2NQNQK"></script>
    <script src="analytics.js?v=ga-20261028"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="assets/branding/aura-society-logo.png" alt="Aura Society Co.">
      </a>
      <nav class="nav-actions" aria-label="Primary navigation">
        <a href="index.html#shop">Shop</a>
      </nav>
    </header>

    <main class="login-shell">
      <section class="login-card">
        <p class="eyebrow">Payment received</p>
        <h1>Thank You</h1>
        <p>Your Stripe checkout was completed. A confirmation email will come from Stripe if email receipts are enabled.</p>
        <a class="primary-link" href="index.html#shop">Continue shopping</a>
        <div id="reviewInvite" class="review-invite hidden">
          <p><strong>Once your fragrance arrives,</strong> come back and tell other shoppers what you think. Bookmark this link:</p>
          <a id="reviewLink" class="secondary-button" href="review.html">Review my order</a>
        </div>
      </section>
    </main>

    <script>
      localStorage.removeItem("auraSocietyCart");
      const orderSession = new URLSearchParams(window.location.search).get("session_id");
      if (typeof reportPendingPurchase === "function") reportPendingPurchase(orderSession);
      if (orderSession && /^cs_/.test(orderSession)) {
        document.querySelector("#reviewLink").href = `review.html?session=${encodeURIComponent(orderSession)}`;
        document.querySelector("#reviewInvite").classList.remove("hidden");
      }
    </script>
  </body>
</html>
